name: Scrape dynamic table sums

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scrape-and-sum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper - 23f2002323@ds.study.iitm.ac.in
        run: npm run scrape
